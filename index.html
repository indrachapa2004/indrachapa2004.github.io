<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Indrachapa Jayasinghe</title>
    <style>
        * {
            font-family: cursive;
        }
        body {
            background: linear-gradient(#08183b,#325379) no-repeat;
        }
        .container {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            color: white;
        }

        .header .links a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin: 40px;
        }
        .header .links a:hover {
            background-color: #325379;
        }

        .main {
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-top: 100px;
        }

        .main .description h2 {
            color: white;
            font-family: "Roboto", sans-serif
        }
        
        .main .description p {
            color: rgb(194, 194, 194);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>Indrachapa Jayasinghe</h1>
            </div>
            <div class="links">
                <a href="">Home</a>
                <a href="">About me</a>
                <a href="">Contact</a>
                <a href="">Projects</a>
            </div>
        </div>

        <div class="main">
            <div class="profile"><img src="https://placehold.net/avatar.png" alt="profile picture"></div>
            <div class="description">
                <h2>Indrachapa Jayasinghe</h2>
                <p>I am a first-year Computer Science undergraduate in University of Jaffna with a keen interest in technology</p>
            </div>
        </div>
    </div>
</body>
</html>
